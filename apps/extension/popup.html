<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>AnswerFrame</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <div class="popup-brand"><span class="mark">⌁</span><div><strong>AnswerFrame</strong><small>Capture the answer.</small></div></div>
    <p class="popup-copy">Save a focused ChatGPT or Gemini answer with its question and every source link — directly into this extension.</p>
    <button id="open-library" class="primary">Open library</button>
    <button id="open-options" class="quiet">Setup & privacy</button>
    <section class="diagnostic" aria-live="polite">
      <div class="diagnostic-head"><span>最近保存状态</span><button id="refresh-status" type="button" title="刷新状态">↻</button></div>
      <strong id="diagnostic-status">正在检查…</strong>
      <small id="diagnostic-time"></small>
    </section>
    <div class="popup-foot"><span class="dot"></span>Private by default · v0.3</div>
    <script src="popup.js"></script>
  </body>
</html>
