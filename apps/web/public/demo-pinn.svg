<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#5b8def"/><stop offset="1" stop-color="#7d64d9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1b2a4a" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="78" y="68" width="1444" height="1064" rx="32" fill="#fff" filter="url(#shadow)"/>
  <circle cx="136" cy="132" r="16" fill="#ff6b6b"/><circle cx="188" cy="132" r="16" fill="#ffc857"/><circle cx="240" cy="132" r="16" fill="#49c46a"/>
  <text x="100" y="230" font-family="Arial,Microsoft YaHei,sans-serif" font-size="45" font-weight="700" fill="#13213c">PINN 入门视频与发展脉络</text>
  <text x="100" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" fill="#52627b">先用 20–30 分钟建立 PINN 的整体图景，再读几篇关键论文。</text>
  <rect x="100" y="342" width="1070" height="72" rx="10" fill="#f6f0ff" stroke="#d4c5ff"/>
  <text x="132" y="390" font-family="Georgia,serif" font-size="34" fill="#3c2a77">uθ(x,t) → Automatic Differentiation → PDE residual → Lphysics</text>
  <text x="100" y="500" font-family="Arial,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#1b2a46">⭐ 首推：Steve Brunton — PINNs Introduction</text>
  <rect x="100" y="540" width="1070" height="232" rx="24" fill="#121b30"/>
  <rect x="128" y="572" width="370" height="168" rx="18" fill="url(#blue)" opacity=".82"/>
  <g stroke="#dce6ff" stroke-width="4" opacity=".9"><path d="M176 614h80M176 660h80M176 706h80M330 614h80M330 660h80M330 706h80"/><path d="M256 614l74 46-74 46M256 660l74-46M256 660l74 46"/></g>
  <circle cx="625" cy="656" r="64" fill="#ff365b"/><polygon points="610,622 610,690 662,656" fill="white"/>
  <text x="540" y="840" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#273858">② PINN 到底是什么时候“第一次提出”的？</text>
  <text x="100" y="900" font-family="Arial,Microsoft YaHei,sans-serif" font-size="31" fill="#52627b">第二篇：最佳的一篇总览 · Karniadakis et al. (2021)</text>
  <text x="100" y="955" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-style="italic" fill="#52627b">Physics-informed machine learning · Nature Reviews Physics</text>
  <line x1="100" y1="1015" x2="1400" y2="1015" stroke="#dfe5ef" stroke-width="3"/>
  <text x="100" y="1070" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" fill="#52627b">会把 forward/inverse problem、data + physics、operator learning 等串起来。</text>
